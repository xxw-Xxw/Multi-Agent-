server:
  port: 8080
  # 只监听本机：/internal/** 供 Python 调用且不做登录校验，不能暴露到局域网
  address: ${APP_SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: doc-review
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://127.0.0.1:5432/docreview}
    driver-class-name: org.postgresql.Driver
    username: ${APP_DB_USERNAME:docreview}
    password: ${APP_DB_PASSWORD:docreview}
    hikari:
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    default-property-inclusion: non_null

app:
  storage:
    dir: ${APP_STORAGE_DIR:./data/files}
    # 单用户累计上传上限，默认 200MB
    max-user-bytes: ${APP_STORAGE_MAX_USER_BYTES:209715200}
  agent:
    # Python LangGraph 推理服务；模型环境变量仅由该服务读取
    base-url: ${APP_AGENT_BASE_URL:http://127.0.0.1:8000}
    java-base-url: ${APP_JAVA_INTERNAL_BASE_URL:http://127.0.0.1:8080}
    timeout-seconds: ${APP_AGENT_TIMEOUT_SECONDS:180}
  review:
    section-max-chars: ${APP_REVIEW_SECTION_MAX_CHARS:800}
    history-limit: ${APP_REVIEW_HISTORY_LIMIT:30}
  chat:
    history-limit: ${APP_CHAT_HISTORY_LIMIT:12}
  auth:
    # 必须通过 APP_AUTH_SECRET 设置至少 16 字节的密钥；留空时启动随机生成（重启后 token 失效）
    secret: ${APP_AUTH_SECRET:}
    ttl-hours: ${APP_AUTH_TTL_HOURS:12}
    # 生产环境（HTTPS）应设为 true
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    # 前后端跨站部署时设为 None（必须同时开启 Secure）
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  sse:
    task-timeout-minutes: ${APP_SSE_TASK_TIMEOUT_MINUTES:30}
  executor:
    core-pool-size: ${APP_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${APP_EXECUTOR_MAX_POOL_SIZE:8}
    queue-capacity: ${APP_EXECUTOR_QUEUE_CAPACITY:50}

logging:
  level:
    com.docreview: INFO
